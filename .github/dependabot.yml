version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    target-branch: develop
    schedule:
      interval: monthly
    groups:
      github-actions:
        patterns:
          - "*"

  - package-ecosystem: gomod
    directory: /build
    target-branch: develop
    schedule:
      interval: monthly
    groups:
      go-modules:
        patterns:
          - "*"
